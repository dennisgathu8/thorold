openapi: "3.1.0"
info:
  title: Thorold API
  description: |
    The Thorold football entity register API. Maps player, team, and coach
    identities across 40+ data providers.
    Named after Thorold Charles Reep (1904-2002), the founding father of
    football analytics. Pure Clojure re-implementation of Reep.
  version: "1.0.0"
  license:
    name: CC0 1.0
    url: https://creativecommons.org/publicdomain/zero/1.0/

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /search:
    get:
      summary: Search entities by name
      description: |
        Fuzzy name search across all entity types. Case-insensitive,
        diacritic-tolerant. Returns up to 25 results by default sorted
        by match score descending.
      parameters:
        - name: name
          in: query
          required: true
          description: Name to search for
          schema:
            type: string
          example: "Cole Palmer"
        - name: type
          in: query
          required: false
          description: Filter by entity type
          schema:
            type: string
            enum: [player, coach, team, competition, season]
        - name: limit
          in: query
          required: false
          description: Max results (1-100, default 25)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityListResponse"
        "400":
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /resolve:
    get:
      summary: Resolve a provider ID to a Thorold entity
      description: |
        Looks up an entity by its ID on a specific data provider.
        Returns the full entity with all known provider IDs.
      parameters:
        - name: provider
          in: query
          required: true
          description: Provider key (e.g. transfermarkt, fbref, sofascore)
          schema:
            type: string
          example: transfermarkt
        - name: id
          in: query
          required: true
          description: The provider ID for this entity
          schema:
            type: string
          example: "568177"
      responses:
        "200":
          description: Resolved entity or empty results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityListResponse"
        "400":
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lookup:
    get:
      summary: Look up an entity by Reep ID or Wikidata QID
      parameters:
        - name: id
          in: query
          required: true
          description: Reep ID (reep_p*, reep_t*, etc.) or Wikidata QID (Q*)
          schema:
            type: string
          example: "reep_p2804f5db"
      responses:
        "200":
          description: Matched entity or empty results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityListResponse"
        "400":
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats:
    get:
      summary: Database statistics
      responses:
        "200":
          description: Entity counts by type and provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"

components:
  schemas:
    Entity:
      type: object
      required: [reep_id, type, external_ids]
      properties:
        reep_id:
          type: string
          example: "reep_p2804f5db"
        qid:
          type: string
          nullable: true
          example: "Q99760796"
        type:
          type: string
          enum: [person/player, person/coach, team, competition, season]
        name_en:
          type: string
          example: "Cole Palmer"
        full_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          nullable: true
          example: "2002-05-06"
        nationality:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        height_cm:
          type: integer
          nullable: true
        country:
          type: string
          nullable: true
          description: Teams only
        founded:
          type: string
          nullable: true
          description: Teams only
        stadium:
          type: string
          nullable: true
          description: Teams only
        external_ids:
          type: object
          additionalProperties:
            type: string
            nullable: true
          example:
            transfermarkt: "568177"
            fbref: "dc7f8a28"
            wikidata: "Q99760796"

    EntityListResponse:
      type: object
      required: [results, count]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/Entity"
        count:
          type: integer

    StatsResponse:
      type: object
      properties:
        total-entities:
          type: integer
        by-type:
          type: object
          additionalProperties:
            type: integer
        by-provider:
          type: object
          additionalProperties:
            type: integer
        load-ms:
          type: integer

    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
