name: Clojure CI

on:
  push:
    branches: [ "main", "rewrite/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '11', '17', '21' ]
    name: Test with Java ${{ matrix.java }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}

    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@12.5
      with:
        cli: 1.11.1.1413
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache Clojure dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
          .cpcache
        key: ${{ runner.os }}-clojure-${{ matrix.java }}-${{ hashFiles('deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-clojure-${{ matrix.java }}-

    - name: Run Tests
      run: clojure -M:test
