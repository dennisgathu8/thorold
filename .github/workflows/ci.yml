# Thorold CI — tests + SLF4J verification
# Native image builds are intentionally not run in CI — see scripts/build-native.sh for local builds.

name: CI

on:
  push:
    branches: [ "rewrite/thorold", "main" ]
  pull_request:
    branches: [ "rewrite/thorold", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '11', '17', '21' ]
    name: Test with Java ${{ matrix.java }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: '1.12.4.1602'

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clojure-${{ matrix.java }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-${{ matrix.java }}-

      - name: Run tests
        run: clojure -M:test

      - name: Verify no SLF4J warnings
        run: |
          output=$(clojure -M:test 2>&1)
          if echo "$output" | grep -q "SLF4J:"; then
            echo "FAIL: SLF4J warnings detected"
            exit 1
          fi
          echo "PASS: No SLF4J warnings"
